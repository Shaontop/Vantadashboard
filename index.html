<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VantaHQ Dashboard</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f5f8,#0d0d12);--panel:light-dark(#fff,#15151d);--panel2:light-dark(#f0eff5,#1b1a24);--text:light-dark(#201e29,#f5f3fb);--muted:light-dark(#777384,#9d99ad);--line:light-dark(#e7e4ed,#2a2836);--purple:#a78bfa;--purple2:#7c3aed;--orange:#ff9c5b;--green:#47d7a0;--red:#fb7185;--shadow:0 16px 42px rgba(0,0,0,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:radial-gradient(ellipse at 88% -8%,rgba(124,58,237,.13),transparent 30%),var(--bg)}.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.sidebar{padding:22px 14px;border-right:1px solid var(--line);background:light-dark(rgba(255,255,255,.7),rgba(17,16,24,.88));display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 9px}.logo{width:39px;height:39px;border-radius:13px;background:linear-gradient(135deg,var(--orange),var(--purple2));display:grid;place-items:center;color:#fff;font-size:19px;font-weight:900;box-shadow:0 7px 20px #7c3aed40}.brand-name{font-size:17px;font-weight:850;letter-spacing:-.5px}.brand-sub{font-size:10px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase}.server{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:11px;display:flex;align-items:center;gap:10px}.server-icon{width:34px;height:34px;border-radius:10px;background:#2a1b3d;color:#d9c9ff;display:grid;place-items:center;font-weight:800}.server-name{font-weight:700;font-size:12px}.server-sub{font-size:11px;color:var(--muted)}.nav-label{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:1.5px;padding:0 12px;margin-bottom:5px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-align:left;font-weight:600;transition:.15s}.nav button:hover{background:var(--panel2);color:var(--text)}.nav button.active{background:linear-gradient(90deg,rgba(167,139,250,.18),rgba(255,156,91,.08));color:var(--text);box-shadow:inset 2px 0 var(--purple)}.nav .ico{width:18px;text-align:center;font-size:16px}.sidebar-bottom{margin-top:auto;display:grid;gap:12px}.plan{border:1px solid var(--line);border-radius:13px;padding:13px;background:linear-gradient(140deg,rgba(167,139,250,.10),rgba(255,156,91,.06))}.plan-title{font-weight:750;margin-bottom:4px}.plan p{color:var(--muted);font-size:11px;margin:0 0 10px}.tiny{font-size:11px;color:var(--muted)}.main{min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,3vw,38px);gap:16px}.crumb{color:var(--muted);font-size:12px}.crumb b{color:var(--text)}.top-actions{display:flex;align-items:center;gap:10px}.status{border:1px solid var(--line);border-radius:100px;padding:7px 11px;font-size:11px;color:var(--orange);display:flex;align-items:center;gap:7px}.dot{height:7px;width:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px #ff9c5b18}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#34234d,#8a4dce);display:grid;place-items:center;font-weight:800}.content{padding:30px clamp(18px,3vw,38px) 50px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:25px}.eyebrow{color:var(--orange);font-weight:800;text-transform:uppercase;letter-spacing:1.6px;font-size:10px;margin-bottom:8px}.pagehead h1{font-size:clamp(25px,3vw,34px);letter-spacing:-1.2px;margin:0 0 6px}.pagehead p{color:var(--muted);margin:0;max-width:650px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{border-color:var(--purple)}.btn.primary{background:linear-gradient(110deg,var(--purple2),#9654dc);border-color:transparent;color:white;box-shadow:0 7px 18px #7c3aed25}.btn.warm{background:linear-gradient(110deg,#f08b45,#bd62c9);border-color:transparent;color:white}.btn.small{padding:7px 10px;font-size:12px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;min-width:0}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{height:34px;width:34px;display:grid;place-items:center;border-radius:11px;background:var(--panel2);font-size:16px}.stat-value{font-size:27px;font-weight:850;letter-spacing:-1px;margin:13px 0 3px}.stat-note{font-size:11px;color:var(--muted)}.positive{color:var(--green)}.dashboard-grid{grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr)}.section-title{font-weight:800;font-size:15px;letter-spacing:-.2px}.section-desc{color:var(--muted);font-size:12px;margin-top:4px}.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:7px;background:rgba(167,139,250,.12);color:var(--purple);font-size:10px;font-weight:800}.feature-list{display:grid;gap:0}.feature{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.feature:last-child{border-bottom:0;padding-bottom:0}.feature-ico{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:var(--panel2);font-size:17px;flex-shrink:0}.feature-main{flex:1;min-width:0}.feature-main strong{display:block;font-size:12px}.feature-main span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.state{font-size:10px;font-weight:800;color:var(--green)}.state.off{color:var(--muted)}.activity{display:grid;gap:16px}.activity-row{display:flex;gap:11px;align-items:flex-start}.activity-dot{height:9px;width:9px;margin-top:4px;border-radius:50%;background:var(--purple);box-shadow:0 0 0 4px #a78bfa20;flex-shrink:0}.activity-row strong{display:block;font-size:12px}.activity-row span{font-size:11px;color:var(--muted)}.callout{margin-top:16px;border:1px solid #a78bfa45;background:linear-gradient(110deg,rgba(124,58,237,.10),rgba(255,156,91,.06));border-radius:14px;padding:15px;display:flex;gap:12px;align-items:flex-start}.callout .bulb{font-size:18px}.callout strong{font-size:12px}.callout p{margin:4px 0 0;color:var(--muted);font-size:11px}.setting-layout{display:grid;grid-template-columns:205px minmax(0,1fr);gap:17px}.subnav{align-self:start;display:grid;gap:5px}.subnav button{text-align:left;background:transparent;border:0;padding:10px 12px;border-radius:9px;color:var(--muted);font-weight:650}.subnav button.active,.subnav button:hover{background:var(--panel2);color:var(--text)}.settings-card{padding:0;overflow:hidden}.settings-intro{padding:20px;border-bottom:1px solid var(--line)}.settings-intro h2{font-size:16px;margin:0 0 5px}.settings-intro p{font-size:12px;color:var(--muted);margin:0}.setting-row{padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}.setting-copy{min-width:0}.setting-copy strong{font-size:12px;display:block}.setting-copy p{font-size:11px;color:var(--muted);margin:4px 0 0}.control{min-width:190px;max-width:280px;width:40%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 11px;border-radius:9px;outline:none}.control:focus{border-color:var(--purple)}.control.full{width:100%;max-width:none}.switch{width:43px;height:25px;flex-shrink:0;border:0;border-radius:20px;background:light-dark(#d5d2de,#373443);padding:3px;transition:.2s}.switch span{display:block;width:19px;height:19px;border-radius:50%;background:white;transition:.2s;box-shadow:0 1px 4px #0002}.switch.on{background:linear-gradient(90deg,var(--purple2),#a78bfa)}.switch.on span{transform:translateX(18px)}.settings-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 20px;background:var(--panel2)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px}.field{display:grid;gap:7px}.field label{font-size:11px;font-weight:750;color:var(--muted)}.field .control{width:100%;max-width:none}.field.wide{grid-column:1/-1}.help{font-size:10px;color:var(--muted)}.command-search{width:min(360px,100%);padding:11px 13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text)}.command-list{display:grid;gap:10px}.command-row{display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:center;padding:15px 17px}.command-name{font-weight:800;color:var(--purple);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.command-desc{font-size:12px}.command-meta{font-size:10px;color:var(--muted);margin-top:3px}.pill{padding:5px 8px;border-radius:7px;background:var(--panel2);color:var(--muted);font-size:10px;font-weight:800}.empty{padding:35px;text-align:center;color:var(--muted)}.toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:13px 17px;border-radius:12px;z-index:10;max-width:350px;display:none}.toast.show{display:block;animation:pop .2s ease-out}.toast strong{display:block;font-size:12px}.toast span{display:block;color:var(--muted);font-size:11px;margin-top:3px}@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}.mobile-menu{display:none}.notice{border:1px solid #ff9c5b50;background:rgba(255,156,91,.07);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:11px;margin-bottom:17px}.notice b{color:var(--orange)}.hidden{display:none!important}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr}.setting-layout{grid-template-columns:1fr}.subnav{display:flex;overflow:auto}.subnav button{white-space:nowrap}.setting-row{align-items:flex-start}.control{min-width:150px}}
@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{position:fixed;z-index:20;inset:0 auto 0 0;width:260px;transform:translateX(-105%);transition:.22s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-flex}.topbar{height:65px}.status{display:none}.pagehead{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.stats{gap:10px}.card{padding:15px}.setting-row{flex-direction:column;gap:12px}.control{width:100%;max-width:none}.switch{align-self:flex-end;margin-top:-36px}.command-row{grid-template-columns:1fr auto;gap:7px}.command-name{grid-column:1/-1}.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.content{padding-top:22px}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">V</div><div><div class="brand-name">Vanta<span style="color:var(--orange)">HQ</span></div><div class="brand-sub">Control center</div></div></div>
  <div class="server"><div class="server-icon">V</div><div style="min-width:0"><div class="server-name">VantaHQ Community</div><div class="server-sub">Demo server · Preview mode</div></div><span style="margin-left:auto;color:var(--muted)">⌄</span></div>
  <div><div class="nav-label">WORKSPACE</div><nav class="nav" id="mainNav">
    <button class="active" data-page="overview"><span class="ico">▦</span>Overview</button>
    <button data-page="moderation"><span class="ico">⬡</span>Moderation</button>
    <button data-page="automod"><span class="ico">◈</span>AutoMod</button>
    <button data-page="welcome"><span class="ico">♧</span>Welcome & Boosts</button>
    <button data-page="tickets"><span class="ico">▤</span>Tickets</button>
    <button data-page="logging"><span class="ico">≋</span>Logging</button>
    <button data-page="roles"><span class="ico">♙</span>Roles & Access</button>
    <button data-page="commands"><span class="ico">⌘</span>Commands</button>
  </nav></div>
  <div><div class="nav-label">SYSTEM</div><nav class="nav"><button data-page="general"><span class="ico">⚙</span>General settings</button><button data-page="integrations"><span class="ico">⇄</span>Integrations</button></nav></div>
  <div class="sidebar-bottom"><div class="plan"><div class="plan-title">✦ VantaHQ Preview</div><p>Your dashboard is interactive. Live Discord connection still needs a backend.</p><button class="btn small" style="width:100%" data-page="integrations">Setup integration ↗</button></div><div class="tiny" style="padding:0 10px">VantaHQ Dashboard · v0.1.0</div></div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><div class="crumb">Workspace <span style="padding:0 7px">/</span><b id="crumb">Overview</b></div></div><div class="top-actions"><div class="status"><span class="dot"></span> PREVIEW MODE</div><div class="avatar">V</div></div></header>
<div class="content" id="pageContent"></div>
</main>
</div>
</div>
<div class="toast" id="toast"><strong id="toastTitle">Saved</strong><span id="toastText">Settings updated.</span></div>
<script>
const defaults={
 moderation:{dmPunishments:true,logPunishments:true,reasonRequired:false,deleteCommandMessages:false,defaultTimeout:'10',warnLimit:'3',warnAction:'timeout',staffRole:'Moderators'},
 automod:{enabled:true,antiSpam:true,antiInvite:true,antiMassMention:true,antiCaps:false,antiLinks:false,spamLimit:'6',mentionLimit:'5',action:'delete_warn'},
 welcome:{welcomeEnabled:true,welcomeChannel:'welcome',welcomeMessage:'Welcome {user} to **{server}**! You are member #{count}.',goodbyeEnabled:false,goodbyeChannel:'general',boostEnabled:true,boostChannel:'boosts',boostMessage:'{user} just boosted the server. Thank you for the support!'},
 tickets:{enabled:true,category:'Tickets',supportRole:'Support Team',transcripts:true,claimButton:true,autoClose:false,closeHours:'48',ticketMessage:'Thanks for opening a ticket! Please explain how we can help.'},
 logging:{enabled:true,channel:'mod-logs',messageDelete:true,messageEdit:true,memberJoin:true,memberLeave:true,roleChanges:true,voiceChanges:false,channelChanges:true},
 roles:{staffRole:'Moderators',adminRole:'Administrators',mutedRole:'Muted',allowStaffPurge:true,allowStaffWarn:true,allowStaffTimeout:true,allowStaffBan:false},
 general:{prefix:',',timezone:'America/New_York',language:'English',deletePrefix:false,commandCooldown:'3',statusText:'VantaHQ • /help',statusType:'Watching'}
};
let config=JSON.parse(JSON.stringify(defaults));let activePage='overview';let toastTimer;
const commandData=[
['help','Show available commands','Utility','Slash + Prefix'],['ping','Check bot latency','Utility','Slash + Prefix'],['avatar','Display a member avatar','Info','Slash + Prefix'],['userinfo','Show member information','Info','Slash + Prefix'],['serverinfo','Show server information','Info','Slash + Prefix'],['membercount','Show server member count','Info','Slash + Prefix'],['warn','Warn a member and optionally DM them','Moderation','Slash + Prefix'],['warnings','View a member’s warnings','Moderation','Slash + Prefix'],['clearwarns','Clear a member’s warnings','Moderation','Slash + Prefix'],['kick','Kick a member','Moderation','Slash + Prefix'],['ban','Ban a member','Moderation','Slash + Prefix'],['unban','Unban a user by ID','Moderation','Slash + Prefix'],['timeout','Timeout a member','Moderation','Slash + Prefix'],['untimeout','Remove a member timeout','Moderation','Slash + Prefix'],['purge','Bulk-delete recent messages','Moderation','Slash + Prefix'],['lock','Lock the current channel','Channels','Slash + Prefix'],['unlock','Unlock the current channel','Channels','Slash + Prefix'],['slowmode','Set channel slowmode','Channels','Slash + Prefix'],['nick','Change a member nickname','Moderation','Slash + Prefix'],['roleadd','Give a member a role','Roles','Slash + Prefix'],['roleremove','Remove a role from a member','Roles','Slash + Prefix'],['setlogs','Choose the moderation log channel','Configuration','Slash + Prefix'],['setwelcome','Configure the welcome channel','Configuration','Slash + Prefix'],['setboostchannel','Choose the server boost channel','Configuration','Slash + Prefix'],['ticketpanel','Post the ticket panel','Tickets','Slash + Prefix']
];
const pages={overview:'Overview',moderation:'Moderation',automod:'AutoMod',welcome:'Welcome & Boosts',tickets:'Tickets',logging:'Logging',roles:'Roles & Access',commands:'Commands',general:'General settings',integrations:'Integrations'};
function el(id){return document.getElementById(id)}
function toast(title,msg){el('toastTitle').textContent=title;el('toastText').textContent=msg;el('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el('toast').classList.remove('show'),3000)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem('vantahq-config',JSON.stringify(config))}catch(e){}toast('Settings saved','Saved in this browser preview. Export the config to use it with the bot.')}
try{const stored=localStorage.getItem('vantahq-config');if(stored)config={...config,...JSON.parse(stored)}}catch(e){}
function toggleRow(key,title,desc){return `<div class="setting-row"><div class="setting-copy"><strong>${title}</strong><p>${desc}</p></div><button class="switch ${config[activePage][key]?'on':''}" data-toggle="${key}" aria-label="Toggle ${title}" aria-pressed="${!!config[activePage][key]}"><span></span></button></div>`}
function selectRow(key,title,desc,options){return `<div class="setting-row"><div class="setting-copy"><strong>${title}</strong><p>${desc}</p></div><select class="control" data-field="${key}">${options.map(o=>`<option value="${esc(o[0])}" ${String(config[activePage][key])===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`}
function inputRow(key,title,desc,type='text'){return `<div class="setting-row"><div class="setting-copy"><strong>${title}</strong><p>${desc}</p></div><input class="control" type="${type}" data-field="${key}" value="${esc(config[activePage][key]??'')}" /></div>`}
function textareaRow(key,title,desc){return `<div class="setting-row"><div class="setting-copy"><strong>${title}</strong><p>${desc}</p></div><textarea class="control" data-field="${key}" rows="3">${esc(config[activePage][key]??'')}</textarea></div>`}
function settingPage(title,desc,subnav,body){return `<div class="pagehead"><div><div class="eyebrow">Configuration</div><h1>${title}</h1><p>${desc}</p></div><div class="actions"><button class="btn" data-action="reset-page">Reset section</button><button class="btn primary" data-action="save">Save changes ↗</button></div></div><div class="notice"><b>Preview only:</b> changes are saved in this browser. The Python bot does not receive them until a backend/config bridge is installed.</div><div class="setting-layout"><div class="card subnav">${subnav.map((x,i)=>`<button class="${i===0?'active':''}" data-scroll="${x[0]}">${x[1]}</button>`).join('')}</div><div class="card settings-card">${body}<div class="settings-footer"><span class="tiny">Changes are not live in Discord yet.</span><button class="btn primary" data-action="save">Save changes</button></div></div></div>`}
function section(id,title,desc,rows){return `<div id="section-${id}"><div class="settings-intro"><h2>${title}</h2><p>${desc}</p></div>${rows}</div>`}
function renderOverview(){return `<div class="pagehead"><div><div class="eyebrow">Server control center</div><h1>Welcome back, <span style="background:linear-gradient(90deg,var(--orange),var(--purple));background-clip:text;color:transparent">VantaHQ.</span></h1><p>Manage your Discord bot from one clean dashboard.</p></div><div class="actions"><button class="btn" data-action="export">⇩ Export config</button><button class="btn primary" data-page="integrations">Connect bot ↗</button></div></div><div class="notice"><b>Heads up:</b> This is a working dashboard preview. Settings and switches are interactive, but they won't affect your live Discord server until the backend is connected.</div><div class="grid stats"><div class="card"><div class="stat-top">Bot status <span class="stat-icon">◉</span></div><div id="botStatus" class="stat-value" style="font-size:22px;color:var(--orange)">Checking...</div><div class="stat-note">Connect your Python bot to go live</div></div><div class="card"><div class="stat-top">Command modules <span class="stat-icon">⌘</span></div><div class="stat-value">8</div><div class="stat-note">Core server management sections</div></div><div class="card"><div class="stat-top">Commands listed <span class="stat-icon">⚡</span></div><div class="stat-value">${commandData.length}</div><div class="stat-note">Common moderation & utility commands</div></div><div class="card"><div class="stat-top">Unsynced changes <span class="stat-icon">◷</span></div><div class="stat-value" id="unsynced">${Object.keys(config).length}</div><div class="stat-note">Local preview configuration sections</div></div></div><div class="grid dashboard-grid"><div class="card"><div class="card-head"><div><div class="section-title">Configuration shortcuts</div><div class="section-desc">Jump straight to the settings you use most.</div></div><span class="badge">QUICK ACCESS</span></div><div class="feature-list"><div class="feature"><div class="feature-ico">⬡</div><div class="feature-main"><strong>Moderation</strong><span>Warnings, punishment defaults, and staff permissions</span></div><button class="btn small" data-page="moderation">Configure →</button></div><div class="feature"><div class="feature-ico">♧</div><div class="feature-main"><strong>Welcome & boosts</strong><span>Set channels and message templates</span></div><button class="btn small" data-page="welcome">Configure →</button></div><div class="feature"><div class="feature-ico">▤</div><div class="feature-main"><strong>Ticket system</strong><span>Support role, category, transcripts, and auto-close</span></div><button class="btn small" data-page="tickets">Configure →</button></div><div class="feature"><div class="feature-ico">≋</div><div class="feature-main"><strong>Logging</strong><span>Choose which server events are tracked</span></div><button class="btn small" data-page="logging">Configure →</button></div></div></div><div class="card"><div class="card-head"><div><div class="section-title">Setup checklist</div><div class="section-desc">What is needed before this can go live.</div></div><span class="badge" style="color:var(--orange)">IN PROGRESS</span></div><div class="activity"><div class="activity-row"><div class="activity-dot"></div><div><strong>Bot project created</strong><span>Python starter project is set up locally.</span></div></div><div class="activity-row"><div class="activity-dot" style="background:var(--orange)"></div><div><strong>Dashboard settings</strong><span>Configure options and export the JSON file.</span></div></div><div class="activity-row"><div class="activity-dot" style="background:var(--muted)"></div><div><strong>Backend connection</strong><span>A small authenticated API is needed to sync settings.</span></div></div><div class="activity-row"><div class="activity-dot" style="background:var(--muted)"></div><div><strong>Discord OAuth</strong><span>Add secure sign-in and server permission checks.</span></div></div></div><div class="callout"><div class="bulb">✦</div><div><strong>Keep it free</strong><p>Start with your Windows PC running the bot and backend. You can use this dashboard to prepare settings without paying for hosting.</p></div></div></div></div>`}
function renderModeration(){let body=section('punishments','Punishment defaults','Choose how moderation actions should behave.',toggleRow('dmPunishments','DM punishment notices','Send a direct message when a member is punished.')+toggleRow('logPunishments','Log moderation actions','Record warnings, bans, kicks, and timeouts in the log channel.')+toggleRow('reasonRequired','Require a reason','Ask staff to provide a reason for each action.')+toggleRow('deleteCommandMessages','Delete command messages','Delete the original prefix command after use.'))+section('defaults','Default actions','Set your preferred warning escalation.',selectRow('defaultTimeout','Default timeout duration','Used when staff do not specify a duration.',[['1','1 minute'],['5','5 minutes'],['10','10 minutes'],['30','30 minutes'],['60','1 hour'],['1440','24 hours']])+selectRow('warnLimit','Warnings before escalation','Warning count that triggers the selected action.',[['2','2 warnings'],['3','3 warnings'],['4','4 warnings'],['5','5 warnings']])+selectRow('warnAction','Escalation action','Action to take when the warning threshold is reached.',[['timeout','Timeout'],['kick','Kick'],['ban','Ban'],['none','No automatic action']]))+section('staff','Staff access','Role names are placeholders until mapped to actual Discord role IDs.',inputRow('staffRole','Moderator role name','Role that should be allowed to use staff commands.'));return settingPage('Moderation','Tune punishments and staff behavior.',[['punishments','Punishment behavior'],['defaults','Default actions'],['staff','Staff access']],body)}
function renderAutomod(){let body=section('core','AutoMod protection','Choose which common disruptive behaviors to flag.',toggleRow('enabled','Enable AutoMod','Master switch for automated checks.')+toggleRow('antiSpam','Anti-spam','Flag repeated messages sent in a short period.')+toggleRow('antiInvite','Block Discord invites','Flag invite links posted by members.')+toggleRow('antiMassMention','Anti mass-mention','Flag messages that mention too many users or roles.')+toggleRow('antiCaps','Anti excessive caps','Flag messages written mostly in uppercase.')+toggleRow('antiLinks','Link filtering','Flag links from members without trusted access.'))+section('thresholds','Detection thresholds','Tune the limits for automatic checks.',inputRow('spamLimit','Messages before spam action','Message count within the short detection window.','number')+inputRow('mentionLimit','Maximum mentions','Number of user/role mentions before flagging.','number')+selectRow('action','Default response','What AutoMod should do when it detects a violation.',[['delete_warn','Delete message + warn'],['delete','Delete message'],['timeout','Delete + timeout'],['log','Log only']]));return settingPage('AutoMod','Protect your server from spam and common disruptions.',[['core','Protection rules'],['thresholds','Thresholds & actions']],body)}
function renderWelcome(){let body=section('welcome','Welcome messages','Configure the greeting for new members.',toggleRow('welcomeEnabled','Enable welcome messages','Post a greeting when someone joins.')+inputRow('welcomeChannel','Welcome channel','Channel name for the welcome message.')+textareaRow('welcomeMessage','Welcome message','Available placeholders: {user}, {server}, {count}.'))+section('goodbye','Goodbye messages','Optional message when a member leaves.',toggleRow('goodbyeEnabled','Enable goodbye messages','Post a message when a member leaves.')+inputRow('goodbyeChannel','Goodbye channel','Channel name for departure messages.'))+section('boosts','Server boosts','Thank members when they boost the server.',toggleRow('boostEnabled','Enable boost notifications','Post a message when a member boosts.')+inputRow('boostChannel','Boost channel','Channel name for boost notifications.')+textareaRow('boostMessage','Boost message','Available placeholders: {user}, {server}.'));return settingPage('Welcome & Boosts','Customize join, leave, and server boost notifications.',[['welcome','Welcome'],['goodbye','Goodbye'],['boosts','Boosts']],body)}
function renderTickets(){let body=section('panel','Ticket panel','Configure the destination and support workflow.',toggleRow('enabled','Enable tickets','Allow members to open support tickets.')+inputRow('category','Ticket category','Category name where ticket channels should be created.')+inputRow('supportRole','Support role','Role name that can see and claim tickets.')+textareaRow('ticketMessage','Opening message','Message shown when a new ticket is created.'))+section('workflow','Ticket workflow','Choose what happens when a ticket is opened or closed.',toggleRow('claimButton','Enable claim button','Let a staff member claim a ticket.')+toggleRow('transcripts','Save ticket transcripts','Save a transcript when a ticket closes.')+toggleRow('autoClose','Enable automatic closing','Close inactive tickets after a set period.')+inputRow('closeHours','Auto-close after (hours)','Used when automatic closing is enabled.','number'));return settingPage('Tickets','Set up a simple support ticket system.',[['panel','Ticket panel'],['workflow','Workflow']],body)}
function renderLogging(){let body=section('destination','Log destination','Choose where the bot should post audit and moderation logs.',toggleRow('enabled','Enable logging','Master switch for logging events.')+inputRow('channel','Log channel','Channel name for logs.'))+section('events','Events to track','Turn specific log types on or off.',toggleRow('messageDelete','Deleted messages','Log when a message is deleted.')+toggleRow('messageEdit','Edited messages','Log before and after message edits.')+toggleRow('memberJoin','Member joins','Log when someone joins.')+toggleRow('memberLeave','Member leaves','Log when someone leaves.')+toggleRow('roleChanges','Role changes','Log role updates and assignments.')+toggleRow('voiceChanges','Voice activity','Log voice channel joins and leaves.')+toggleRow('channelChanges','Channel changes','Log channel creation, deletion, and updates.'));return settingPage('Logging','Choose which server events VantaHQ should record.',[['destination','Destination'],['events','Events']],body)}
function renderRoles(){let body=section('roleset','Role mapping','These are role names for now. A live integration should save Discord role IDs.',inputRow('adminRole','Administrator role','Role with access to high-impact configuration.')+inputRow('staffRole','Moderator role','Role for day-to-day moderation.')+inputRow('mutedRole','Muted role','Role used by a mute command, if enabled.'))+section('permissions','Staff command access','Choose which actions your staff roles can use.',toggleRow('allowStaffPurge','Allow staff to purge','Allow moderators to bulk-delete messages.')+toggleRow('allowStaffWarn','Allow staff to warn','Allow moderators to warn members.')+toggleRow('allowStaffTimeout','Allow staff to timeout','Allow moderators to timeout members.')+toggleRow('allowStaffBan','Allow staff to ban','Allow moderators to ban members.'));return settingPage('Roles & Access','Plan staff role mappings and command permissions.',[['roleset','Role mapping'],['permissions','Command permissions']],body)}
function renderGeneral(){let body=section('prefix','Bot preferences','Set how the bot behaves across your server.',inputRow('prefix','Prefix','Prefix for classic commands (default is comma).')+selectRow('timezone','Timezone','Used for timestamps and scheduled behavior.',[['America/New_York','Eastern Time'],['America/Chicago','Central Time'],['America/Denver','Mountain Time'],['America/Los_Angeles','Pacific Time'],['UTC','UTC']])+selectRow('language','Language','Default language for bot responses.',[['English','English']])+toggleRow('deletePrefix','Delete prefix commands','Delete the command message after processing.')+inputRow('commandCooldown','Command cooldown (seconds)','Basic cooldown to reduce accidental spam.','number')+inputRow('statusText','Bot status text','Text shown in the bot presence.')+selectRow('statusType','Status type','Presence activity type.',[['Watching','Watching'],['Playing','Playing'],['Listening','Listening'],['Competing','Competing']]));return settingPage('General settings','Set default behavior for the VantaHQ bot.',[['prefix','Bot preferences']],body)}
function renderIntegrations(){return `<div class="pagehead"><div><div class="eyebrow">Connections</div><h1>Integrations</h1><p>Connect the dashboard to your Discord bot safely.</p></div></div><div class="notice"><b>Important:</b> The current website preview cannot contact your local Python bot directly. No Discord login or live API connection is active yet.</div><div class="grid dashboard-grid"><div class="card"><div class="card-head"><div><div class="section-title">Python bot bridge</div><div class="section-desc">The piece that syncs website settings with your bot.</div></div><span class="badge" style="color:var(--orange)">NOT CONNECTED</span></div><div class="feature-list"><div class="feature"><div class="feature-ico">✓</div><div class="feature-main"><strong>Existing Python bot</strong><span>Keep your bot token in the local .env file. Never put it in website code.</span></div></div><div class="feature"><div class="feature-ico">◷</div><div class="feature-main"><strong>Authenticated API</strong><span>Needs endpoints for reading and saving settings, protected by a secret or Discord OAuth.</span></div></div><div class="feature"><div class="feature-ico">⇄</div><div class="feature-main"><strong>Shared configuration</strong><span>Bot and website should read/write the same SQLite database or authenticated API.</span></div></div></div><button class="btn primary" style="margin-top:18px" data-action="export">Export current settings JSON ↓</button></div><div class="card"><div class="card-head"><div><div class="section-title">Free setup plan</div><div class="section-desc">Run it locally first, then decide if you need hosting.</div></div></div><div class="activity"><div class="activity-row"><div class="activity-dot"></div><div><strong>1. Export your config</strong><span>Download the JSON and keep it beside your bot project.</span></div></div><div class="activity-row"><div class="activity-dot"></div><div><strong>2. Add the API bridge</strong><span>A small local web server can expose settings to the dashboard.</span></div></div><div class="activity-row"><div class="activity-dot"></div><div><strong>3. Add Discord sign-in</strong><span>Only let people with Manage Server access edit settings.</span></div></div><div class="activity-row"><div class="activity-dot"></div><div><strong>4. Test locally</strong><span>Run bot and backend on your PC before considering hosting.</span></div></div></div><div class="callout"><div class="bulb">🔒</div><div><strong>Security first</strong><p>Never expose your Discord bot token in frontend JavaScript, public repositories, or a browser download.</p></div></div></div></div>`}
function renderCommands(){return `<div class="pagehead"><div><div class="eyebrow">Command reference</div><h1>Commands</h1><p>Common Bleed-style moderation and utility commands. The list is a dashboard reference, not a guarantee every command is already implemented in your current bot file.</p></div><button class="btn" data-action="export">⇩ Export config</button></div><div class="notice"><b>Note:</b> Prefix commands use the comma by default. Slash-command availability depends on the bot code and Discord command sync.</div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:15px"><input id="commandSearch" class="command-search" placeholder="Search commands… (e.g. ban, avatar)" /><span class="tiny" id="commandCount">${commandData.length} commands</span></div><div class="command-list" id="commandList">${commandData.map(c=>commandRow(c)).join('')}</div>`}
function commandRow(c){return `<div class="card command-row" data-search="${esc(c.join(' ').toLowerCase())}"><div class="command-name">,${esc(c[0])}</div><div><div class="command-desc">${esc(c[1])}</div><div class="command-meta">${esc(c[2])}</div></div><span class="pill">${esc(c[3])}</span></div>`}
function render(){el('crumb').textContent=pages[activePage];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===activePage));const c=el('pageContent');c.innerHTML=activePage==='overview'?renderOverview():activePage==='moderation'?renderModeration():activePage==='automod'?renderAutomod():activePage==='welcome'?renderWelcome():activePage==='tickets'?renderTickets():activePage==='logging'?renderLogging():activePage==='roles'?renderRoles():activePage==='general'?renderGeneral():activePage==='integrations'?renderIntegrations():renderCommands();el('sidebar').classList.remove('open');if(activePage==='commands'){const s=el('commandSearch');s.addEventListener('input',()=>{let q=s.value.toLowerCase().trim(),n=0;document.querySelectorAll('.command-row').forEach(r=>{let show=r.dataset.search.includes(q);r.classList.toggle('hidden',!show);if(show)n++});el('commandCount').textContent=n+' commands'});}}
function downloadConfig(){const blob=new Blob([JSON.stringify({product:'VantaHQ',schemaVersion:1,generatedAt:new Date().toISOString(),settings:config},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vantahq-config.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Config exported','vantahq-config.json downloaded. The bot needs a bridge to load it.')}
function resetPage(){if(!confirm('Reset this section to its default settings?'))return;config[activePage]=JSON.parse(JSON.stringify(defaults[activePage]));try{localStorage.setItem('vantahq-config',JSON.stringify(config))}catch(e){}render();toast('Section reset','Defaults restored for '+pages[activePage]+'.')}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){activePage=p.dataset.page;render();return}const sw=e.target.closest('[data-toggle]');if(sw){const k=sw.dataset.toggle;config[activePage][k]=!config[activePage][k];sw.classList.toggle('on',config[activePage][k]);sw.setAttribute('aria-pressed',String(config[activePage][k]));return}const sc=e.target.closest('[data-scroll]');if(sc){document.querySelectorAll('[data-scroll]').forEach(b=>b.classList.toggle('active',b===sc));const target=el('section-'+sc.dataset.scroll);if(target)target.scrollIntoView({behavior:'smooth',block:'start'});return}const a=e.target.closest('[data-action]');if(a){if(a.dataset.action==='save')save();if(a.dataset.action==='export')downloadConfig();if(a.dataset.action==='reset-page')resetPage()}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-field]')){config[activePage][t.dataset.field]=t.type==='number'?t.value:t.value;}});
el('menuBtn').addEventListener('click',()=>el('sidebar').classList.toggle('open'));
async function updateBotStatus() {
  const statusEl = document.getElementById('botStatus');
  if (!statusEl) return;

  try {
    const response = await fetch('https://vantahq-api.onrender.com/api/status');
    if (!response.ok) throw new Error('API request failed');

    const data = await response.json();

    statusEl.textContent = data.connected ? 'Connected' : 'Offline';
    statusEl.style.color = data.connected ? 'var(--green)' : 'var(--orange)';
  } catch (error) {
    statusEl.textContent = 'API offline';
    statusEl.style.color = 'var(--orange)';
  }
}

render();
updateBotStatus();
setInterval(updateBotStatus, 30000);
</script>
